<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Myphin mark: a dark ledger tile, a gold serif dollar sign, and a budget rule beneath it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a231c"/>
      <stop offset="1" stop-color="#14110f"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="88" y="88" width="848" height="848" rx="180" fill="none" stroke="#3a3228" stroke-width="6"/>
  <text x="512" y="648" text-anchor="middle" fill="#e0a14a" font-size="560" font-weight="700"
        font-family="Iowan Old Style, Palatino Linotype, Palatino, Times New Roman, serif">$</text>
  <!-- Ledger rule: muted track with a gold "spent so far" fill, like the Month screen bars. -->
  <rect x="232" y="748" width="560" height="22" rx="11" fill="#3a3228"/>
  <rect x="232" y="748" width="392" height="22" rx="11" fill="#f3ead8"/>
</svg>
