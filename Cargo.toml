[package]
name = "myphin"
version = "0.1.0"
edition = "2021"
description = "Personal finance tracker with SimpleFIN sync"
license = "MIT"
default-run = "myphin"

[lib]
name = "myphin"
path = "src/lib.rs"

[[bin]]
name = "myphin"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chacha20poly1305 = "0.10"
dirs = "6"
dioxus = { version = "0.7.10", features = ["router"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1
